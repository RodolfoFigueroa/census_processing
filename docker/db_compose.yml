services:
  postgis:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    container_name: postgis
    restart: unless-stopped
    volumes:
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    environment:
      - TZ=America/Mexico_City
    ports:
      - 5432:5432
    env_file: "../.env"
