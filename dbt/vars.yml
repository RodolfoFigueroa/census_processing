vars:
  # Previous pandas read_csv defaults plus explicit census suppression markers.
  census_null_tokens:
    - ""
    - "#N/A"
    - "#N/A N/A"
    - "#NA"
    - "-1.#IND"
    - "-1.#QNAN"
    - "-NaN"
    - "-nan"
    - "1.#IND"
    - "1.#QNAN"
    - "<NA>"
    - "N/A"
    - "NA"
    - "NULL"
    - "NaN"
    - "None"
    - "n/a"
    - "nan"
    - "null"
    - "*"
    - "N/D"
  census_2010_columns:
    - name: cvegeo
      data_type: text
      description: Unique identifier for the geographic area.
      config:
        meta:
          description_es: null
    - name: graproes
      data_type: float
      description: Average years of schooling
      config:
        meta:
          description_es: Grado promedio de escolaridad
    - name: graproes_f
