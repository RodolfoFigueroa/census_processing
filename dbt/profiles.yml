census_processing:
  target: dev

  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      dbname: "{{ env_var('POSTGRES_CENSUS_DB') }}"
      user: "{{ env_var('POSTGRES_CENSUS_USER') }}"
      password: "{{ env_var('POSTGRES_CENSUS_PASSWORD') }}"
      schema: public
      threads: 4
