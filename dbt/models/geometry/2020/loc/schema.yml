version: 2

models:
  - name: geometry_2020_loc
    description: 2020 locality geometries.

    config:
      meta:
        spatial: true
        dagster:
          asset_key: ["geometry", "2020", "loc"]
          group: geometry/2020

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2020_loc")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
      - name: geometry
        data_type: geometry
