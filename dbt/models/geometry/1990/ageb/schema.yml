version: 2

models:
  - name: geometry_1990_ageb
    description: 1990 AGEB geometries.

    config:
      meta:
        spatial: true
        dagster:
          asset_key: ["geometry", "1990", "ageb"]
          group: geometry/1990

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_1990_ageb")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
      - name: geometry
        data_type: geometry
