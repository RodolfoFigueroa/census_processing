version: 2
models:
  - name: scince_2010_mor
    description: Typed 2010 SCINCE mor attributes at AGEB level.
    config:
      schema: staging
      materialized: table
      contract:
        enforced: true
      meta:
        dagster:
          asset_key:
            - staging
            - '2010'
            - scince
            - mor
          group: staging/2010/scince
    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es: null
      - name: mor1_r
        data_type: float
        description: Percentage of deceased children among children born to women aged 12 years and older
        config:
          meta:
            description_es: Porcentaje de hijos fallecidos de las mujeres de 12 años y más
      - name: _source_file
        data_type: text
      - name: _source_member
        data_type: text
