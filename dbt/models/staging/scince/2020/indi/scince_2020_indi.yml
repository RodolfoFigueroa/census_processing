version: 2
models:
  - name: scince_2020_indi
    description: Typed 2020 SCINCE indi attributes at AGEB level.
    config:
      schema: staging
      materialized: table
      contract:
        enforced: true
      meta:
        dagster:
          asset_key:
            - staging
            - '2020'
            - scince
            - indi
          group: staging/2020/scince
    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es: null
      - name: afro1
        data_type: int
        description: Population that identifies as Afro-Mexican or of African descent
        config:
          meta:
            description_es: Población que se considera afromexicana o afrodescendiente
      - name: afro2
        data_type: int
        description: Female population that identifies as Afro-Mexican or of African descent
        config:
          meta:
            description_es: Población femenina que se considera afromexicana o afrodescendiente
      - name: afro3
        data_type: int
        description: Male population that identifies as Afro-Mexican or of African descent
        config:
          meta:
            description_es: Población masculina que se considera afromexicana o afrodescendiente
      - name: afro4
        data_type: int
        description: Population aged 0 to 14 years that identifies as Afro-Mexican or of African descent
        config:
          meta:
            description_es: Población de 0 a 14 años que se considera afromexicana o afrodescendiente
      - name: afro5
        data_type: int
        description: Population aged 15 to 59 years that identifies as Afro-Mexican or of African descent
        config:
          meta:
            description_es: Población de 15 a 59 años que se considera afromexicana o afrodescendiente
