version: 2
models:
  - name: census_2010
    description: Typed 2010 census records at every source geographic level.
    config:
      schema: staging
      materialized: table
      contract:
        enforced: true
      meta:
        dagster:
          asset_key:
            - staging
            - '2010'
            - census
          group: staging/2010/census
    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the geographic area.
        config:
          meta:
            description_es: null
      - name: graproes
        data_type: float
        description: Average years of schooling
        config:
          meta:
            description_es: Grado promedio de escolaridad
      - name: graproes_f
        data_type: float
        description: Average years of schooling of the female population
        config:
          meta:
            description_es: Grado promedio de escolaridad de la población femenina
      - name: graproes_m
        data_type: float
        description: Average years of schooling of the male population
        config:
          meta:
            description_es: Grado promedio de escolaridad de la población masculina
      - name: hogjef_f
        data_type: int
        description: Census households with a female head of household
        config:
          meta:
            description_es: Hogares censales con jefatura femenina
      - name: hogjef_m
        data_type: int
        description: Census households with a male head of household
        config:
          meta:
            description_es: Hogares censales con jefatura masculina
      - name: ocupvivpar
