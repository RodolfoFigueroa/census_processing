version: 2

models:
  - name: census_2000_ageb
    description: 2000 census geometries at the AGEB level. For actual censal data, see the scince_2000_ageb model.

    config:
      contract:
        enforced: true

      meta:
        spatial: true
        dagster:
          asset_key: ["census", "2000", "ageb"]
          group: census/2000

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cve_met]
        to: ref("metropoli_2020")
        to_columns: [cve_met]

    columns:
      - name: cvegeo
        data_type: text
      - name: cve_met
        data_type: text
      - name: cve_loc
        data_type: text
      - name: geometry
        data_type: geometry
