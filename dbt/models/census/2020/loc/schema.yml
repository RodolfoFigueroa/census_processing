version: 2

models:
  - name: census_2020_loc
    description: 2020 census statistics aggregated by locality

    config:
      meta:
        dagster:
          asset_key: ["census", "2020", "loc"]
          group: census/2020

    constraints:
      - type: primary_key
        columns: [cvegeo]
      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2020_loc")
        to_columns: [cvegeo]
      - type: check
        expression: "char_length(cvegeo) = 9"

    # yaml-language-server-disable Incorrect type
    columns: "{{ var('census_2020_columns') + [{'name': 'nom_loc', 'data_type': 'text'}] }}"
