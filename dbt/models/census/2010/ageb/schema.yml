version: 2

models:
  - name: census_2010_ageb
    description: 2010 census statistics aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["census", "2010", "ageb"]
          group: census/2010

    constraints:
      - type: primary_key
        columns: [cvegeo]
      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2010_ageb")
        to_columns: [cvegeo]
      - type: check
        expression: "char_length(cvegeo) = 13"

    # yaml-language-server-disable Incorrect type
    columns: "{{ var('census_2010_columns') }}"
