version: 2

models:
  - name: census_1990_ageb
    description: 1990 census geometries at the AGEB level. For actual censal data, see the scince_1990_ageb model.

    config:
      contract:
        enforced: true

      meta:
        spatial: true
        dagster:
          asset_key: ["census", "1990", "ageb"]
          group: census/1990

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cve_met]
        to: ref("metropoli_2020")
        to_columns: [cve_met]

    columns:
      - name: cvegeo
        data_type: text
      - name: cve_met
        data_type: text
      - name: cve_loc
        data_type: text
      - name: geometry
        data_type: geometry
