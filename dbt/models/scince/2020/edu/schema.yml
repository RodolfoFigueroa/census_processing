version: 2

models:
  - name: scince_2020_ageb_edu
    description:
      2020 census education statistics obtained from the SCINCE dataset,
      aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2020", "ageb", "edu"]
          group: scince/2020

    constraints:
      - type: primary_key
        columns:
          - cvegeo

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2020_ageb")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es:
      - name: edu1
        data_type: int
        description: Population aged 3 to 5 years attending school
        config:
          meta:
            description_es: Población de 3 a 5 años que asiste a la escuela
