version: 2

models:
  - name: scince_2020_ageb_fec
    description:
      2020 census fecundity statistics obtained from the SCINCE dataset,
      aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2020", "ageb", "fec"]
          group: scince/2020

    constraints:
      - type: primary_key
        columns:
          - cvegeo

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2020_ageb")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es:
      - name: fec1_r
        data_type: float
        description: Average number of children born alive
        config:
          meta:
            description_es: Promedio de hijas e hijos nacidos vivos
      - name: fec2_r
        data_type: float
        description: Average number of children born alive to women aged 15 to 49 years
        config:
          meta:
            description_es:
              Promedio de hijas e hijos nacidos vivos de la población femenina
              de 15 a 49 años
      - name: fec3_r
        data_type: float
        description: Percentage of women aged 15 to 19 years with at least one child born alive
        config:
          meta:
            description_es:
              Porcentaje de población femenina de 15 a 19 años con al menos
              una hija o hijo nacido vivo
