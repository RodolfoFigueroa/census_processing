version: 2

models:
  - name: scince_2020_ageb_disc
    description:
      2020 census disability statistics obtained from the SCINCE dataset,
      aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2020", "ageb", "disc"]
          group: scince/2020

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2020_ageb")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es:
      - name: disc1
        data_type: int
        description: Disabled population
        config:
          meta:
            description_es: Población con discapacidad
      - name: disc2
        data_type: int
        description: Disabled female population
        config:
          meta:
            description_es: Población femenina con discapacidad
      - name: disc3
        data_type: int
        description: Disabled male population
        config:
          meta:
            description_es: Población masculina con discapacidad
      - name: disc4
        data_type: int
        description: Disabled population aged 0 to 14 years
        config:
          meta:
            description_es: Población de 0 a 14 años con discapacidad
      - name: disc5
        data_type: int
        description: Disabled population aged 15 to 59 years
        config:
          meta:
            description_es: Población de 15 a 59 años con discapacidad
      - name: disc6
        data_type: int
        description: Disabled population aged 60 years and older
        config:
          meta:
            description_es: Población de 60 años y más con discapacidad
      - name: disc7
        data_type: int
        description: Population with a disability affecting walking, climbing, or descending
        config:
          meta:
            description_es: Población con discapacidad para caminar, subir o bajar
      - name: disc8
        data_type: int
        description: Population with a disability affecting vision, even when wearing glasses
        config:
          meta:
            description_es: Población con discapacidad para ver, aun usando lentes
      - name: disc9
        data_type: int
        description: Population with a disability affecting speech or communication
        config:
          meta:
            description_es: Población con discapacidad para hablar o comunicarse
      - name: disc10
        data_type: int
        description: Population with a disability affecting hearing, even when using a hearing aid
        config:
          meta:
            description_es: Población con discapacidad para oír, aun usando aparato auditivo
      - name: disc11
        data_type: int
        description: Population with a disability affecting dressing, bathing, or eating
        config:
          meta:
            description_es: Población con discapacidad para vestirse, bañarse o comer
      - name: disc12
        data_type: int
        description: Population with a disability affecting memory or concentration
        config:
          meta:
            description_es: Población con discapacidad para recordar o concentrarse
      - name: disc13
        data_type: int
        description: Population with a mental problem or condition
        config:
          meta:
            description_es: Población con algún problema o condición mental
      - name: disc14
        data_type: int
        description: Population without a disability, limitation, mental problem, or mental condition
        config:
          meta:
            description_es:
              Población sin discapacidad, limitación, problema o condición
              mental
      - name: disc15
        data_type: int
        description: Population with activity limitations
        config:
          meta:
            description_es: Población con limitación
      - name: disc16
        data_type: int
        description: Female population with activity limitations
        config:
          meta:
            description_es: Población femenina con limitación
      - name: disc17
        data_type: int
        description: Male population with activity limitations
        config:
          meta:
            description_es: Población masculina con limitación
      - name: disc18
        data_type: int
        description: Population aged 0 to 14 years with activity limitations
        config:
          meta:
            description_es: Población de 0 a 14 años con limitación
      - name: disc19
        data_type: int
        description: Population aged 15 to 59 years with activity limitations
        config:
          meta:
            description_es: Población de 15 a 59 años con limitación
      - name: disc20
        data_type: int
        description: Population aged 60 years and older with activity limitations
        config:
          meta:
            description_es: Población de 60 años y más con limitación
