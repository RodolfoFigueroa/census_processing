version: 2

models:
  - name: scince_2020_ageb_disc
    description:
      2020 census disability statistics obtained from the SCINCE dataset,
      aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2020", "ageb", "disc"]
          group: scince/2020

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2020_ageb")
        to_columns: [cvegeo]

    columns: "{{ var('scince_columns')['2020']['disc'] }}"
