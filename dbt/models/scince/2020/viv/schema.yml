version: 2

models:
  - name: scince_2020_ageb_viv
    description:
      2020 census dwelling statistics obtained from the SCINCE dataset,
      aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2020", "ageb", "viv"]
          group: scince/2020

    constraints:
      - type: primary_key
        columns:
          - cvegeo

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2020_ageb")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es:
      - name: viv0
        data_type: int
        description: Total dwellings
        config:
          meta:
            description_es: Total de viviendas
      - name: viv1
        data_type: int
        description: Total inhabited dwellings
        config:
          meta:
            description_es: Total de viviendas habitadas
      - name: viv2
        data_type: int
        description: Inhabited private dwellings
        config:
          meta:
            description_es: Viviendas particulares habitadas
      - name: viv3
        data_type: int
        description: Inhabitants of inhabited private dwellings
        config:
          meta:
            description_es: Ocupantes en viviendas particulares habitadas
      - name: viv4
        data_type: int
        description: Uninhabited private dwellings
        config:
          meta:
            description_es: Viviendas particulares deshabitadas
      - name: viv5
        data_type: int
        description: Private dwellings for temporary use
        config:
          meta:
            description_es: Viviendas particulares de uso temporal
      - name: viv6
        data_type: int
        description: Collective dwellings
        config:
          meta:
            description_es: Viviendas colectivas
      - name: viv7
        data_type: int
        description: Inhabited private dwellings with dirt floors
        config:
          meta:
            description_es: Viviendas particulares habitadas con piso de tierra
      - name: viv8
        data_type: int
        description: Inhabited private dwellings with one bedroom
        config:
          meta:
            description_es: Viviendas particulares habitadas con un dormitorio
      - name: viv9
        data_type: int
        description: Inhabited private dwellings with two or more bedrooms
        config:
          meta:
            description_es: Viviendas particulares habitadas con dos dormitorios y más
      - name: viv10
        data_type: int
        description: Inhabited private dwellings with more than 2.5 inhabitants per bedroom
        config:
          meta:
            description_es:
              Viviendas particulares habitadas con más de 2.5 ocupantes
              por dormitorio
      - name: viv11
        data_type: int
        description: Inhabited private dwellings with only one room
        config:
          meta:
            description_es: Viviendas particulares habitadas con sólo un cuarto
      - name: viv12
        data_type: int
        description: Inhabited private dwellings with two rooms
        config:
          meta:
