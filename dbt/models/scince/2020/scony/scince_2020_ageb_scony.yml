version: 2
models:
  - name: scince_2020_ageb_scony
    description: 2020 census marital status statistics obtained from the SCINCE dataset, aggregated by
      AGEB.
    config:
      meta:
        dagster:
          asset_key:
            - scince
            - '2020'
            - ageb
            - scony
          group: scince/2020
    constraints:
      - type: primary_key
        columns:
          - cvegeo
      - type: foreign_key
        columns:
          - cvegeo
        to: ref("geo_unit_2020_ageb")
        to_columns:
          - cvegeo
    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es: null
      - name: scony1
        data_type: int
        description: Population aged 12 years and older who are single or have never been in a union
        config:
          meta:
            description_es: Población de 12 años y más soltera o nunca unida
      - name: scony2
        data_type: int
        description: Female population aged 12 years and older who are single or have never been in a
          union
        config:
          meta:
            description_es: Población femenina de 12 años y más soltera o nunca unida
      - name: scony3
        data_type: int
        description: Male population aged 12 years and older who are single or have never been in a union
        config:
          meta:
            description_es: Población masculina de 12 años y más soltera o nunca unida
      - name: scony4
        data_type: int
        description: Population aged 12 years and older who are married or in a union
        config:
          meta:
            description_es: Población de 12 años y más casada o unida
      - name: scony5
        data_type: int
        description: Female population aged 12 years and older who are married or in a union
        config:
          meta:
            description_es: Población femenina de 12 años y más casada o unida
      - name: scony6
        data_type: int
        description: Male population aged 12 years and older who are married or in a union
        config:
          meta:
            description_es: Población masculina de 12 años y más casada o unida
      - name: scony7
        data_type: int
        description: Population aged 12 years and older who were formerly married or in a union
        config:
          meta:
            description_es: Población de 12 años y más que estuvo casada o unida
      - name: scony8
        data_type: int
        description: Female population aged 12 years and older who were formerly married or in a union
        config:
          meta:
            description_es: Población femenina de 12 años y más que estuvo casada o unida
      - name: scony9
        data_type: int
        description: Male population aged 12 years and older who were formerly married or in a union
        config:
          meta:
            description_es: Población masculina de 12 años y más que estuvo casada o unida
      - name: scony10
        data_type: int
        description: Population aged 15 to 24 years who are married or in a union
        config:
          meta:
            description_es: Población de 15 a 24 años casada o unida
      - name: scony11
        data_type: int
        description: Female population aged 15 to 24 years who are married or in a union
        config:
          meta:
            description_es: Población femenina de 15 a 24 años casada o unida
      - name: scony12
        data_type: int
        description: Male population aged 15 to 24 years who are married or in a union
        config:
          meta:
            description_es: Población masculina de 15 a 24 años casada o unida
