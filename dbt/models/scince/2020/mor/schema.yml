version: 2

models:
  - name: scince_2020_ageb_mor
    description:
      2020 census mortality statistics obtained from the SCINCE dataset,
      aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2020", "ageb", "mor"]
          group: scince/2020

    constraints:
      - type: primary_key
        columns:
          - cvegeo

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2020_ageb")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es:
      - name: mor1_r
        data_type: float
        description: Percentage of deceased children among children born to women aged 12 years and older
        config:
          meta:
            description_es: Porcentaje de hijas e hijos fallecidos de la población femenina de 12 años y más
