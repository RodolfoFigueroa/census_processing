version: 2
models:
  - name: scince_2010_ageb_disc
    description: 2010 census disability statistics obtained from the SCINCE dataset, aggregated by AGEB.
    config:
      meta:
        dagster:
          asset_key:
            - scince
            - '2010'
            - ageb
            - disc
          group: scince/2010
    constraints:
      - type: primary_key
        columns:
          - cvegeo
      - type: foreign_key
        columns:
          - cvegeo
        to: ref("geo_unit_2010_ageb")
        to_columns:
          - cvegeo
    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es: null
      - name: disc1
        data_type: int
        description: Disabled population
        config:
          meta:
            description_es: Población con discapacidad
      - name: disc2
        data_type: int
        description: Disabled female population
        config:
          meta:
            description_es: Población femenina con discapacidad
      - name: disc3
        data_type: int
        description: Disabled male population
        config:
          meta:
            description_es: Población masculina con discapacidad
      - name: disc4
        data_type: int
        description: Disabled population aged 0 to 14 years
        config:
          meta:
            description_es: Población de 0 a 14 años con discapacidad
      - name: disc5
        data_type: int
        description: Disabled population aged 15 to 59 years
        config:
          meta:
            description_es: Población de 15 a 59 años con discapacidad
      - name: disc6
        data_type: int
        description: Disabled population aged 60 years and older
        config:
          meta:
            description_es: Población de 60 años y más con discapacidad
      - name: disc14
        data_type: int
        description: Population with activity limitations entitled to health care services
        config:
          meta:
            description_es: Población con limitación en la actividad derechohabiente a servicios de salud
