version: 2
models:
  - name: scince_2010_ageb_mor
    description: 2010 census mortality statistics obtained from the SCINCE dataset, aggregated by AGEB.
    config:
      meta:
        dagster:
          asset_key:
            - scince
            - '2010'
            - ageb
            - mor
          group: scince/2010
    constraints:
      - type: primary_key
        columns:
          - cvegeo
      - type: foreign_key
        columns:
          - cvegeo
        to: ref("geo_unit_2010_ageb")
        to_columns:
          - cvegeo
    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es: null
      - name: mor1_r
        data_type: float
        description: Percentage of deceased children among children born to women aged 12 years and older
        config:
          meta:
            description_es: Porcentaje de hijos fallecidos de las mujeres de 12 años y más
