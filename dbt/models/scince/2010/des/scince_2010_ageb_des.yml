version: 2
models:
  - name: scince_2010_ageb_des
    description: 2010 census development statistics obtained from the SCINCE dataset, aggregated by AGEB.
    config:
      meta:
        dagster:
          asset_key:
            - scince
            - '2010'
            - ageb
            - des
          group: scince/2010
    constraints:
      - type: primary_key
        columns:
          - cvegeo
      - type: foreign_key
        columns:
          - cvegeo
        to: ref("geo_unit_2010_ageb")
        to_columns:
          - cvegeo
    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es: null
      - name: grado_marg
        data_type: text
        description: CONAPO marginalization level
        config:
          meta:
            description_es: Grado de marginación CONAPO
