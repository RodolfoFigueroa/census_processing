version: 2

models:
  - name: scince_2010_ageb_viv
    description: 2010 census dwelling statistics obtained from the SCINCE dataset, aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2010", "ageb", "viv"]
          group: scince/2010

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2010_ageb")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es:
      - name: viv0
        data_type: int
        description: Total dwellings
        config:
          meta:
            description_es: Total de viviendas
      - name: viv1
        data_type: int
        description: Total inhabited dwellings
        config:
          meta:
            description_es: Total de viviendas habitadas
      - name: viv2
        data_type: int
        description: Inhabited private dwellings
        config:
          meta:
            description_es: Viviendas particulares habitadas
      - name: viv3
        data_type: int
        description: Inhabitants of private dwellings
        config:
          meta:
            description_es: Ocupantes en viviendas particulares
      - name: viv6
        data_type: int
        description: Inhabited private dwellings with dirt floors
        config:
          meta:
            description_es: Viviendas particulares habitadas con piso de tierra
      - name: viv7
        data_type: int
        description: Inhabited private dwellings with one bedroom
        config:
          meta:
            description_es: Viviendas particulares habitadas con un dormitorio
      - name: viv8
        data_type: int
        description: Inhabited private dwellings with two or more bedrooms
        config:
          meta:
            description_es: Viviendas particulares habitadas con dos dormitorios y más
      - name: viv9
        data_type: int
        description: Inhabited private dwellings with more than 2.5 inhabitants per bedroom
        config:
          meta:
            description_es: Viviendas particulares habitadas con más de 2.5 ocupantes por dormitorio
      - name: viv10
        data_type: int
        description: Inhabited private dwellings with only one room
        config:
          meta:
            description_es: Viviendas particulares habitadas con un solo cuarto
      - name: viv11
        data_type: int
        description: Inhabited private dwellings with two rooms
        config:
          meta:
            description_es: Viviendas particulares habitadas con dos cuartos
      - name: viv12
        data_type: int
        description: Inhabited private dwellings with three or more rooms
        config:
          meta:
            description_es: Viviendas particulares habitadas con 3 cuartos y más
      - name: viv13
        data_type: int
        description: Private dwellings with more than three inhabitants per room
        config:
          meta:
            description_es: Viviendas particulares con más de 3 ocupantes por cuarto
      - name: viv14
        data_type: int
        description: Inhabited private dwellings with electricity
        config:
          meta:
            description_es: Viviendas particulares habitadas que disponen de luz eléctrica
      - name: viv15
        data_type: int
        description: Inhabited private dwellings without electricity
        config:
          meta:
            description_es: Viviendas particulares habitadas que no disponen de luz eléctrica
      - name: viv16
        data_type: int
        description: Inhabited private dwellings with piped water on the premises
        config:
          meta:
            description_es:
              Viviendas particulares habitadas que disponen de agua entubada en
              el ámbito de la vivienda
      - name: viv17
        data_type: int
        description: Inhabited private dwellings without piped water on the premises
        config:
          meta:
            description_es:
              Viviendas particulares habitadas que no disponen de agua entubada
              en el ámbito de la vivienda
      - name: viv18
        data_type: int
        description: Inhabitants of private dwellings with access to piped water on the premises
        config:
          meta:
            description_es:
              Ocupantes en viviendas particulares  con acceso a agua entubada
              en el ámbito de la vivienda
      - name: viv19
        data_type: int
        description: Inhabited private dwellings with a toilet
