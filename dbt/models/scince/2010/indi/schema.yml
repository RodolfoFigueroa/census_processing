version: 2

models:
  - name: scince_2010_ageb_indi
    description: 2010 census indigenous language statistics obtained from the SCINCE dataset, aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2010", "ageb", "indi"]
          group: scince/2010

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2010_ageb")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es:
      - name: indi1
        data_type: int
        description: Population aged 3 years and older that speaks an indigenous language
        config:
          meta:
            description_es: Población de 3 años y más que habla alguna lengua indígena
      - name: indi2
        data_type: int
        description: Female population aged 3 years and older that speaks an indigenous language
        config:
          meta:
            description_es: Población femenina de 3 años y más que habla alguna lengua indígena
      - name: indi3
        data_type: int
        description: Male population aged 3 years and older that speaks an indigenous language
        config:
          meta:
            description_es: Población masculina de 3 años y más que habla alguna lengua indígena
      - name: indi4
        data_type: int
        description:
          Population aged 3 years and older that speaks an indigenous language
          and does not speak Spanish
        config:
          meta:
            description_es:
              Población de 3 años y más que habla alguna lengua indígena y no
              habla español
      - name: indi5
        data_type: int
        description:
          Female population aged 3 years and older that speaks an indigenous
          language and does not speak Spanish
        config:
          meta:
            description_es:
              Población femenina de 3 años y más que habla alguna lengua indígena
