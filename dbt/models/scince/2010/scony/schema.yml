version: 2

models:
  - name: scince_2010_ageb_scony
    description: 2010 census marriage statistics obtained from the SCINCE dataset, aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2010", "ageb", "scony"]
          group: scince/2010

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2010_ageb")
        to_columns: [cvegeo]

    columns: "{{ var('scince_columns')['2010']['scony'] }}"
