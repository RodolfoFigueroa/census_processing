version: 2

models:
  - name: scince_2010_ageb_relig
    description: 2010 census religion statistics obtained from the SCINCE dataset, aggregated by AGEB.

    config:
      meta:
        dagster:
          asset_key: ["scince", "2010", "ageb", "relig"]
          group: scince/2010

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cvegeo]
        to: ref("geo_unit_2010_ageb")
        to_columns: [cvegeo]

    columns:
      - name: cvegeo
        data_type: text
        description: Unique identifier for the AGEB.
        config:
          meta:
            description_es:
      - name: relig1
        data_type: int
        description: Catholic population
        config:
          meta:
            description_es: Población con religión católica
      - name: relig2
        data_type: int
        description: Population with Protestant, Evangelical, or non-Evangelical Biblical religions
        config:
          meta:
            description_es: Protestantes, Evangélicas y Bíblicas diferentes de evangélicas
      - name: relig3
        data_type: int
        description: Population with religions other than those listed above
        config:
          meta:
            description_es: Población con otras religiones diferentes a las anteriores
      - name: relig4
        data_type: int
        description: Population with no religion
        config:
          meta:
            description_es: Población sin religión
