models:
  - name: scince_1990_ageb
    description: 1990 census statistics obtained from the SCINCE dataset, aggregated by AGEB (Área Geoestadística Básica).

    config:
      contract:
        enforced: true

      meta:
        dagster:
          asset_key: ["scince", "1990", "ageb"]
          group: scince/1990

    constraints:
      - type: primary_key
        columns: [cvegeo]

      - type: foreign_key
        columns: [cvegeo]
        to: ref("census_1990_ageb")
        to_columns: [cvegeo]

    columns: *scince_columns
