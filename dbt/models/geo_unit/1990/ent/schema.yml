version: 2

models:
  - name: geo_unit_1990_ent
    description: 1990 geographic units at the ent level, including all source units and implied ancestors.
    config:
      meta:
        dagster:
          asset_key: ["geo_unit", "1990", "ent"]
          group: geo_unit/1990
    constraints:
      - type: primary_key
        columns: [cvegeo]
      - type: check
        expression: "char_length(cvegeo) = 2"
    columns:
      - name: cvegeo
        data_type: text
