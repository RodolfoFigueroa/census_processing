version: 2

models:
  - name: geo_unit_2000_ent
    description: 2000 geographic units at the ent level, including all source units and implied ancestors.
    config:
      meta:
        dagster:
          asset_key: ["geo_unit", "2000", "ent"]
          group: geo_unit/2000
    constraints:
      - type: primary_key
        columns: [cvegeo]
      - type: check
        expression: "char_length(cvegeo) = 2"
    columns:
      - name: cvegeo
        data_type: text
