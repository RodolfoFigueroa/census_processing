version: 2

models:
  - name: geo_unit_2010_loc
    description: 2010 geographic units at the loc level, including all source units and implied ancestors.
    config:
      meta:
        dagster:
          asset_key: ["geo_unit", "2010", "loc"]
          group: geo_unit/2010
      indexes:
        - columns: [cve_mun]
          type: btree
    constraints:
      - type: primary_key
        columns: [cvegeo]
      - type: check
        expression: "char_length(cvegeo) = 9"
      - type: foreign_key
        columns: [cve_mun]
        to: ref("geo_unit_2010_mun")
        to_columns: [cvegeo]
      - type: check
        expression: "cve_mun = left(cvegeo, 5)"
    columns:
      - name: cvegeo
        data_type: text
        data_tests: [unique, not_null]
      - name: cve_mun
        data_type: text
        description: Parent mun identifier derived from cvegeo.
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("geo_unit_2010_mun")
                field: cvegeo
