version: 2

models:
  - name: geo_unit_2010_ageb
    description: 2010 geographic units at the ageb level, including all source units and implied ancestors.
    config:
      meta:
        dagster:
          asset_key: ["geo_unit", "2010", "ageb"]
          group: geo_unit/2010
      indexes:
        - columns: [cve_loc]
          type: btree
        - columns: [cve_met]
          type: btree
    constraints:
      - type: primary_key
        columns: [cvegeo]
      - type: check
        expression: "char_length(cvegeo) = 13"
      - type: foreign_key
        columns: [cve_loc]
        to: ref("geo_unit_2010_loc")
        to_columns: [cvegeo]
      - type: check
        expression: "cve_loc = left(cvegeo, 9)"
      - type: foreign_key
        columns: [cve_met]
        to: ref("metropoli_2020")
        to_columns: [cve_met]
    columns:
      - name: cvegeo
        data_type: text
        data_tests: [unique, not_null]
      - name: cve_loc
        data_type: text
        description: Parent loc identifier derived from cvegeo.
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("geo_unit_2010_loc")
                field: cvegeo
      - name: cve_met
        data_type: text
        description: 2020 metropolitan zone selected by greatest positive overlap, breaking ties by cve_met; null without geometry or positive overlap.
        data_tests:
          - relationships:
              arguments:
                to: ref("metropoli_2020")
                field: cve_met
