type: cfc_dagster_utils.components.postgres.PostgresConnectionComponent
attributes:
  host: "{{ env.POSTGRES_HOST }}"
  port: "{{ env.POSTGRES_PORT }}"
  database: "{{ env.POSTGRES_CENSUS_DB }}"
  user: "{{ env.POSTGRES_CENSUS_USER }}"
  password: "{{ env.POSTGRES_CENSUS_PASSWORD }}"
  resource_key: postgres_resource
  io_manager_key: postgres_manager
